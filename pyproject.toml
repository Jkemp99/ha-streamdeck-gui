[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-streamdeck-gui"
version = "0.1.0"
description = "Self-hosted web GUI for authoring home-assistant-streamdeck-yaml configuration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ha-streamdeck-gui contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "ruamel.yaml>=0.18",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ha-streamdeck-gui = "ha_streamdeck_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_streamdeck_gui"]

[tool.hatch.build.targets.sdist]
include = ["src/ha_streamdeck_gui", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
