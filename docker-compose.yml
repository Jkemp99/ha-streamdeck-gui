services:
  editor:
    build: .
    image: ha-streamdeck-gui:local
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      STREAMDECK_YAML_PATH: /data/streamdeck.yaml
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      DECK_MODEL: ${DECK_MODEL:-plus}
      BACKUP_COUNT: ${BACKUP_COUNT:-10}
      SYSTEMD_SERVICE_NAME: ${SYSTEMD_SERVICE_NAME:-}
      ASSETS_DIR: ${ASSETS_DIR:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
